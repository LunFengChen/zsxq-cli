name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/zsxq${{ matrix.exe }}" \
             "dist/zsxq-cli-${{ matrix.asset }}${{ matrix.exe }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
